<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas | K-Music</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="custom-bg min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-purple">
            <div class="container">
                <a class="navbar-brand fw-bold text-purple" href="index.html">K-Music</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="artistas.html">Artistas</a></li>
                        <li class="nav-item"><a class="nav-link" href="favoritos.html">Favoritos</a></li>
                        <li class="nav-item"><a class="nav-link active text-purple" href="estadisticas.html">Estadísticas</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                        <li class="nav-item"><a class="nav-link text-danger" href="login.html">Salir</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <h2 class="fw-bold text-light mb-4 border-bottom border-purple pb-2"><span class="text-purple">Estadísticas</span> de la Biblioteca</h2>
        
        <div class="row mt-4">
            <article class="col-md-8 mb-4">
                <div class="card bg-dark border-purple p-4 shadow">
                    <h5 class="text-light mb-3">Distribución por Género Musical</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-striped align-middle" id="tablaGeneros">
                            <thead>
                                <tr>
                                    <th>Género</th>
                                    <th class="text-center">Cantidad de Álbumes</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </article>

            <aside class="col-md-4 mb-4">
                <div class="card bg-dark border-secondary p-4 text-center mb-3 shadow">
                    <h2 class="text-purple fw-bold display-5" id="totalAlbums">0</h2>
                    <p class="text-secondary mb-0 fw-semibold">Álbumes Registrados</p>
                </div>
                <div class="card bg-dark border-secondary p-4 text-center shadow">
                    <h2 class="text-purple fw-bold display-5" id="totalCanciones">0</h2>
                    <p class="text-secondary mb-0 fw-semibold">Canciones Totales</p>
                </div>
            </aside>
        </div>
    </main>

    <footer class="bg-dark text-center text-secondary py-3 border-top border-secondary mt-5">
        <div class="container">
            <small>&copy; 2026 K-Music. Facultad de Estadísticas e Informática - UV.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('../xml/biblioteca.xml')
                .then(response => response.text())
                .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
                .then(data => {
                    const albums = data.getElementsByTagName("album");
                    let totalCanciones = 0;
                    const generosCount = {};

                    for (let i = 0; i < albums.length; i++) {
                        let genero = albums[i].getElementsByTagName("genero")[0].textContent;
                        let cancionesAlbum = albums[i].getElementsByTagName("cancion").length;
                        
                        totalCanciones += cancionesAlbum;

                        if (generosCount[genero]) {
                            generosCount[genero] += 1;
                        } else {
                            generosCount[genero] = 1;
                        }
                    }

                    document.getElementById("totalAlbums").textContent = albums.length;
                    document.getElementById("totalCanciones").textContent = totalCanciones;

                    const tbody = document.querySelector("#tablaGeneros tbody");
                    tbody.innerHTML = "";

                    for (let gen in generosCount) {
                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-semibold text-light">${gen}</td>
                                <td class="text-center text-purple fw-bold">${generosCount[gen]}</td>
                            </tr>
                        `;
                    }
                })
                .catch(error => console.error(error));
        });
    </script>
</body>
</html>
