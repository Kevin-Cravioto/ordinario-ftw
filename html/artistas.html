<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistas | K-Music</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="custom-bg min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-purple">
        <div class="container">
            <a class="navbar-brand fw-bold text-purple" href="catalogo.html">K-Music</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link active text-purple" href="artistas.html">Artistas</a></li>
                    <li class="nav-item"><a class="nav-link" href="estadisticas.html">Estadísticas</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="login.html">Salir</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="fw-bold text-light mb-4 border-bottom border-purple pb-2">Artistas <span class="text-purple">Destacados</span></h2>
        
        <div class="row row-cols-1 row-cols-md-3 g-4 mt-3" id="contenedorArtistas">
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('../xml/biblioteca.xml')
                .then(response => response.text())
                .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
                .then(data => {
                    const albums = data.getElementsByTagName("album");
                    const artistasData = {};

                    for (let i = 0; i < albums.length; i++) {
                        let artista = albums[i].getElementsByTagName("artista")[0].textContent;
                        let genero = albums[i].getElementsByTagName("genero")[0].textContent;

                        if (artistasData[artista]) {
                            artistasData[artista].count += 1;
                        } else {
                            artistasData[artista] = { genero: genero, count: 1 };
                        }
                    }

                    const contenedor = document.getElementById("contenedorArtistas");
                    contenedor.innerHTML = "";

                    for (let artista in artistasData) {
                        let info = artistasData[artista];
                        let textoAlbum = info.count === 1 ? "1 Álbum" : `${info.count} Álbumes`;

                        contenedor.innerHTML += `
                            <div class="col">
                                <div class="card bg-dark border-secondary h-100 text-center p-3 shadow">
                                    <h4 class="text-light mt-2">${artista}</h4>
                                    <p class="text-secondary">${info.genero}</p>
                                    <span class="badge bg-purple rounded-pill mx-auto mb-2" style="width: fit-content;">${textoAlbum}</span>
                                </div>
                            </div>
                        `;
                    }
                })
                .catch(error => console.error(error));
        });
    </script>
</body>
</html>
