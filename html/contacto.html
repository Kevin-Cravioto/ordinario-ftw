<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | K-Music</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="custom-bg min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-purple">
        <div class="container">
            <a class="navbar-brand fw-bold text-purple" href="catalogo.html">K-Music</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="artistas.html">Artistas</a></li>
                    <li class="nav-item"><a class="nav-link" href="estadisticas.html">Estadísticas</a></li>
                    <li class="nav-item"><a class="nav-link active text-purple" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="login.html">Salir</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card bg-dark border-purple p-4 shadow-lg">
                    <h3 class="fw-bold text-light mb-3">Envíanos un <span class="text-purple">Mensaje</span></h3>
                    <p class="text-secondary mb-4">¿Encontraste un error o quieres sugerir un álbum nuevo? Llena el formulario.</p>
                    
                    <div id="alertaContacto"></div>

                    <form id="formContacto">
                        <div class="mb-3">
                            <label class="form-label text-secondary" for="nombreInput">Nombre</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="nombreInput" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary" for="emailInput">Correo Electrónico</label>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="emailInput" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary" for="mensajeInput">Mensaje</label>
                            <textarea class="form-control bg-dark text-light border-secondary" id="mensajeInput" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-purple w-100">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const formContacto = document.getElementById('formContacto');
        const alertaContacto = document.getElementById('alertaContacto');

        formContacto.addEventListener('submit', function(evento) {
            evento.preventDefault(); 

            alertaContacto.innerHTML = `
                <div class="alert alert-success alert-dismissible fade show bg-success text-light border-0" role="alert">
                    <strong>¡Mensaje enviado!</strong> Gracias por tus sugerencias.
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;

            formContacto.reset();

            setTimeout(() => {
                alertaContacto.innerHTML = '';
            }, 4000);
        });
    </script>
</body>
</html>
