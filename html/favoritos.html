<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos | K-Music</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 custom-bg">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark nav-aesthetic border-bottom border-purple">
            <div class="container">
                <a class="navbar-brand fw-bold text-purple" href="index.html">K-Music</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav gap-2">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="artistas.html">Artistas</a></li>
                        <li class="nav-item"><a class="nav-link active text-purple" href="favoritos.html">Favoritos</a></li>
                        <li class="nav-item"><a class="nav-link" href="estadisticas.html">Estadísticas</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                        <li class="nav-item"><a class="nav-link text-danger" href="login.html">Salir</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1 container py-5">
        <h2 class="fw-bold text-light mb-4 border-bottom border-purple pb-2">Mis <span class="text-purple">Favoritos</span></h2>
        
        <div class="row row-cols-1 row-cols-md-3 g-4" id="contenedor-favoritos">
            </div>
    </main>

    <footer class="bg-dark text-center text-secondary py-4 border-top border-secondary mt-auto footer-aesthetic">
        <div class="container">
            <p class="mb-1 text-light fw-semibold">K-Music &copy; 2026</p>
            <small>Proyecto FTW - Desarrollado por Kevin Cravioto</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Cargar y parsear el archivo XML
            fetch('../xml/biblioteca.xml')
                .then(response => response.text())
                .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
                .then(data => {
                    const albums = data.getElementsByTagName("album");
                    const contenedor = document.getElementById("contenedor-favoritos");
                    contenedor.innerHTML = ""; 

                    // Mostrar exactamente los primeros 3 álbumes por defecto
                    let limite = Math.min(albums.length, 3);
                    for (let i = 0; i < limite; i++) {
                        let titulo = albums[i].getElementsByTagName("titulo")[0] ? albums[i].getElementsByTagName("titulo")[0].textContent : "Desconocido";
                        let artista = albums[i].getElementsByTagName("artista")[0] ? albums[i].getElementsByTagName("artista")[0].textContent : "Desconocido";
                        let genero = albums[i].getElementsByTagName("genero")[0] ? albums[i].getElementsByTagName("genero")[0].textContent : "Varios";

                        renderTarjeta(titulo, artista, genero, contenedor);
                    }

                    // Agregar el aviso al final de las tarjetas
                    contenedor.innerHTML += `
                        <div class="col-12 text-center text-secondary mt-5 w-100">
                            <p class="mb-0">Aún no has agregado favoritos propios. Mostrando sugerencias por defecto.</p>
                        </div>
                    `;
                })
                .catch(error => {
                    console.error("Error en la carga del XML:", error);
                    document.getElementById("contenedor-favoritos").innerHTML = `<p class="text-danger text-center w-100">Error al cargar la biblioteca.</p>`;
                });

            // Función para renderizar tarjetas en el DOM
            function renderTarjeta(titulo, artista, genero, contenedor) {
                contenedor.innerHTML += `
                    <div class="col">
                        <div class="card bg-dark border-purple h-100 shadow">
                            <div class="card-body text-center d-flex flex-column">
                                <h5 class="card-title text-light fw-bold">${titulo}</h5>
                                <p class="card-text text-secondary mb-2">${artista}</p>
                                <div class="mt-auto">
                                    <span class="badge text-bg-secondary mb-3">${genero}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
