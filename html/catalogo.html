<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | K-Music</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navegación con borde desvanecido -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark nav-aesthetic">
            <div class="container">
                <a class="navbar-brand fw-bold text-purple" href="index.html">K-Music</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav gap-2">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active text-purple" href="catalogo.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="artistas.html">Artistas</a></li>
                        <li class="nav-item"><a class="nav-link" href="favoritos.html">Favoritos</a></li>
                        <li class="nav-item"><a class="nav-link" href="estadisticas.html">Estadísticas</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                        <li class="nav-item"><a class="nav-link text-danger" href="login.html">Salir</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Sección del Catálogo -->
    <main class="flex-grow-1 custom-bg py-5">
        <div class="container">
            <div class="text-center mb-5">
                <h2 class="display-5 fw-bold">Explora el <span class="text-purple">Catálogo</span></h2>
                <p class="text-secondary">Descubre los mejores álbumes y califícalos.</p>
                <div class="aesthetic-line mt-3"></div>
            </div>


            <div class="row justify-content-center mb-5">
                <div class="col-md-6 col-lg-5">
                    <input type="text" id="buscador" class="form-control bg-dark text-light border-purple text-center" placeholder="Buscar por álbum o artista..." style="border-radius: 20px;">
                </div>
            </div>

            <div id="contenedor-catalogo" class="row row-cols-1 row-cols-md-3 g-4">

            <!-- Contenedor donde JavaScript inyectará las tarjetas de los álbumes -->
            <div id="contenedor-catalogo" class="row row-cols-1 row-cols-md-3 g-4">
                
                <!-- Mensaje temporal de carga que desaparecerá cuando el JS lea el XML -->
                <div class="col-12 text-center text-secondary">
                    <div class="spinner-border text-purple mb-3" role="status"></div>
                    <p>Cargando la biblioteca musical...</p>
                </div>

            </div>
        </div>
    </main>

    <!-- Pie de página con borde desvanecido -->
    <footer class="bg-dark text-center py-3 mt-auto footer-aesthetic">
        <div class="container">
            <p class="text-secondary mb-0">Proyecto FTW - Desarrollado por Kevin Cravioto</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Archivo JS conectado para leer el XML -->
    <script src="..\js\app.js"></script>
</body>
</html>
